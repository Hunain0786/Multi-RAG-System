services:
  postgres:
    image: postgres:16-alpine
    container_name: multirag-postgres
    environment:
      POSTGRES_USER: multirag
      POSTGRES_PASSWORD: multirag
      POSTGRES_DB: multirag
    ports:
      # Host port 5434 (5432 and 5433 are already in use by other local containers).
      # Match this with DATABASE_URL in .env.
      - "5434:5432"
    volumes:
      - multirag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multirag -d multirag"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: multirag-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  multirag_pgdata:
